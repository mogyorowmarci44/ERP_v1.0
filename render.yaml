services:
  - type: web
    name: mm-erp
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # v3.9.8 – napi összefoglaló e-mail: Gmail-továbbító HTTPS-en (scripts/gmail-relay.gs) – az ingyenes Render tiltja az SMTP-t
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # v3.9.2 – SMTP (csak fizetős Render-csomagon működik) és az ütemező titkos kulcsa
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CRON_SECRET
        sync: false
      # v3.10.0 – napi banki letöltés (Enable Banking / PSD2): alkalmazás-azonosító, privát kulcs (PEM), az ERP nyilvános címe
      - key: EB_APP_ID
        sync: false
      - key: EB_PRIVATE_KEY
        sync: false
      - key: APP_URL
        sync: false
      # v6.1.0 – érzékeny személyes adatok titkosítási kulcsa (openssl rand -base64 32) – őrizd meg külön is!
      - key: DATA_ENCRYPTION_KEY
        sync: false
