services:
  - type: web
    name: mm-erp
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # v3.9.2 – napi összefoglaló e-mail (Gmail alkalmazásjelszó) és az ütemező titkos kulcsa
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CRON_SECRET
        sync: false
