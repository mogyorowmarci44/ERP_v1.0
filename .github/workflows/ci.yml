name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrációk a teszt-adatbázisra
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_test
      # v7.2.0 – S3-kompatibilis tároló-emulátor, hogy a fájltároló és a tárolóbeli mentés tesztjei is fussanak
      - name: S3-emulátor (moto) indítása
        run: |
          pip install -q "moto[server]"
          nohup moto_server -p 5055 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:5055 && break; sleep 1; done
      - name: Integrációs teszt (teljes könyvelési folyamat, adatelkülönítés, fájltároló, mentés)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_test
          S3_TEST_ENDPOINT: http://127.0.0.1:5055
